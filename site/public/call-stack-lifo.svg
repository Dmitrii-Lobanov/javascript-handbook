<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110" role="img" aria-labelledby="title description">
  <title id="title">JavaScript call stack growth and unwinding</title>
  <desc id="description">A stack contains script, formatTotal, addTax, and readSubtotal frames. Calls push frames toward the top, only readSubtotal runs at maximum depth, and returns pop frames in reverse order.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151d"/>
      <stop offset="1" stop-color="#1e2930"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdc6a"/>
      <stop offset="1" stop-color="#f3c542"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece9f8"/>
      <stop offset="1" stop-color="#d9d4ed"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#deeffb"/>
      <stop offset="1" stop-color="#c3e2f5"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f7f3"/>
      <stop offset="1" stop-color="#b7ebe5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <marker id="arrow-up" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#67d5cc"/>
    </marker>
    <marker id="arrow-down" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#f3c542"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #67d5cc; font-size: 18px; font-weight: 800; letter-spacing: 2.5px; }
      .heading { fill: #f8f5ed; font-size: 36px; font-weight: 800; }
      .subhead { fill: #adb4c0; font-size: 21px; }
      .frame-title-dark { fill: #282315; font-size: 27px; font-weight: 800; }
      .frame-title-purple { fill: #29253d; font-size: 27px; font-weight: 800; }
      .frame-title-blue { fill: #17384f; font-size: 27px; font-weight: 800; }
      .frame-title-teal { fill: #123c39; font-size: 27px; font-weight: 800; }
      .detail-dark { fill: #514722; font-size: 19px; }
      .detail-purple { fill: #514b6e; font-size: 19px; }
      .detail-blue { fill: #31546d; font-size: 19px; }
      .detail-teal { fill: #315e5a; font-size: 19px; }
      .side-label { font-size: 17px; font-weight: 900; letter-spacing: 2px; }
      .badge { fill: #173b38; font-size: 15px; font-weight: 900; letter-spacing: 1.3px; }
      .return-title { fill: #f8f5ed; font-size: 22px; font-weight: 800; }
      .return-detail { fill: #b8bec9; font-size: 19px; }
      .footer { fill: #e6e2d9; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1000" height="1110" rx="34" fill="url(#bg)"/>
  <text x="70" y="64" class="eyebrow">LAST IN · FIRST OUT</text>
  <text x="70" y="112" class="heading">The call stack tracks unfinished calls</text>
  <text x="70" y="151" class="subhead">At maximum depth, only the top frame runs. Every frame below it waits.</text>

  <path d="M105 744V258" stroke="#67d5cc" stroke-width="5" marker-end="url(#arrow-up)"/>
  <text x="80" y="525" text-anchor="middle" transform="rotate(-90 80 525)" fill="#67d5cc" class="side-label">CALLS PUSH</text>

  <path d="M895 258V744" stroke="#f3c542" stroke-width="5" marker-end="url(#arrow-down)"/>
  <text x="920" y="525" text-anchor="middle" transform="rotate(90 920 525)" fill="#f3c542" class="side-label">RETURNS POP</text>

  <rect x="180" y="220" width="640" height="126" rx="22" fill="url(#teal)" stroke="#48bfb6" stroke-width="3" filter="url(#shadow)"/>
  <text x="220" y="269" class="frame-title-teal">readSubtotal(order)</text>
  <text x="220" y="309" class="detail-teal">Running now · returns 100</text>
  <rect x="663" y="250" width="115" height="40" rx="20" fill="#8ddbd4"/>
  <text x="720" y="276" text-anchor="middle" class="badge">TOP</text>

  <rect x="200" y="366" width="600" height="126" rx="22" fill="url(#blue)" stroke="#5594bb" stroke-width="3" filter="url(#shadow)"/>
  <text x="240" y="415" class="frame-title-blue">addTax(order)</text>
  <text x="240" y="455" class="detail-blue">Paused · waiting for readSubtotal</text>

  <rect x="220" y="512" width="560" height="126" rx="22" fill="url(#purple)" stroke="#8a82ab" stroke-width="3" filter="url(#shadow)"/>
  <text x="260" y="561" class="frame-title-purple">formatTotal(order)</text>
  <text x="260" y="601" class="detail-purple">Paused · waiting for addTax</text>

  <rect x="240" y="658" width="520" height="126" rx="22" fill="url(#yellow)" stroke="#aa8527" stroke-width="3" filter="url(#shadow)"/>
  <text x="280" y="707" class="frame-title-dark">Script</text>
  <text x="280" y="747" class="detail-dark">Paused · waiting for formatTotal</text>

  <path d="M500 784V839" stroke="#aeb5c1" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="500" y="869" text-anchor="middle" class="eyebrow">UNWIND IN REVERSE ORDER</text>

  <rect x="125" y="900" width="230" height="82" rx="20" fill="#252b35" stroke="#49515e" stroke-width="2"/>
  <text x="240" y="935" text-anchor="middle" class="return-title">readSubtotal</text>
  <text x="240" y="964" text-anchor="middle" class="return-detail">returns 100</text>

  <path d="M355 941H393" stroke="#aeb5c1" stroke-width="3" marker-end="url(#arrow-down)"/>

  <rect x="405" y="900" width="190" height="82" rx="20" fill="#252b35" stroke="#49515e" stroke-width="2"/>
  <text x="500" y="935" text-anchor="middle" class="return-title">addTax</text>
  <text x="500" y="964" text-anchor="middle" class="return-detail">returns 120</text>

  <path d="M595 941H633" stroke="#aeb5c1" stroke-width="3" marker-end="url(#arrow-down)"/>

  <rect x="645" y="900" width="230" height="82" rx="20" fill="#252b35" stroke="#49515e" stroke-width="2"/>
  <text x="760" y="935" text-anchor="middle" class="return-title">formatTotal</text>
  <text x="760" y="964" text-anchor="middle" class="return-detail">returns “$120.00”</text>

  <rect x="110" y="1022" width="780" height="52" rx="20" fill="#2c333d"/>
  <text x="500" y="1055" text-anchor="middle" class="footer">Call stack = dynamic execution order · not lexical scope · not async ancestry</text>
</svg>
