<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" role="img" aria-labelledby="title description">
  <title id="title">Anatomy of lexical environments and bindings</title>
  <desc id="description">A block environment contains bindings with mutable or immutable and initialized or uninitialized states. Its outer environment links to a function environment, then a global environment, then null.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151d"/>
      <stop offset="1" stop-color="#1e2930"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f7f3"/>
      <stop offset="1" stop-color="#b7ebe5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece9f8"/>
      <stop offset="1" stop-color="#d9d4ed"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#deeffb"/>
      <stop offset="1" stop-color="#c3e2f5"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1dc"/>
      <stop offset="1" stop-color="#ffc9c1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#aeb5c1"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #67d5cc; font-size: 18px; font-weight: 800; letter-spacing: 2.5px; }
      .heading { fill: #f8f5ed; font-size: 36px; font-weight: 800; }
      .subhead { fill: #adb4c0; font-size: 21px; }
      .record-title { fill: #123c39; font-size: 29px; font-weight: 800; }
      .record-type { fill: #315e5a; font-size: 18px; font-weight: 700; }
      .column { fill: #6b727f; font-size: 16px; font-weight: 800; letter-spacing: 1.2px; }
      .name { fill: #262238; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 23px; font-weight: 800; }
      .cell { fill: #514b6e; font-size: 19px; }
      .danger-name { fill: #572720; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 23px; font-weight: 800; }
      .danger-cell { fill: #723a32; font-size: 19px; font-weight: 700; }
      .outer-label { fill: #c3c8d1; font-size: 18px; font-weight: 800; }
      .small-title-purple { fill: #29253d; font-size: 26px; font-weight: 800; }
      .small-detail-purple { fill: #514b6e; font-size: 20px; }
      .small-title-blue { fill: #17384f; font-size: 26px; font-weight: 800; }
      .small-detail-blue { fill: #31546d; font-size: 20px; }
      .null { fill: #f8f5ed; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 25px; font-weight: 800; }
      .footer { fill: #e6e2d9; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1000" height="1180" rx="34" fill="url(#bg)"/>
  <text x="70" y="64" class="eyebrow">SPECIFICATION MODEL</text>
  <text x="70" y="112" class="heading">Environment = bindings + an outer link</text>
  <text x="70" y="151" class="subhead">Each binding has identity, behavior, and lifecycle state—not just a value.</text>

  <rect x="90" y="194" width="820" height="418" rx="26" fill="url(#teal)" stroke="#48bfb6" stroke-width="3" filter="url(#shadow)"/>
  <text x="135" y="246" class="record-title">Current block environment</text>
  <text x="135" y="279" class="record-type">DECLARATIVE ENVIRONMENT RECORD</text>

  <line x1="130" y1="314" x2="870" y2="314" stroke="#91d9d3" stroke-width="2"/>
  <text x="150" y="347" class="column">NAME</text>
  <text x="350" y="347" class="column">BINDING</text>
  <text x="535" y="347" class="column">STATE</text>
  <text x="720" y="347" class="column">VALUE</text>

  <rect x="125" y="365" width="750" height="66" rx="14" fill="#f2fbfa"/>
  <text x="150" y="407" class="name">count</text>
  <text x="350" y="407" class="cell">mutable</text>
  <text x="535" y="407" class="cell">initialized</text>
  <text x="720" y="407" class="name">2</text>

  <rect x="125" y="445" width="750" height="66" rx="14" fill="#f2fbfa"/>
  <text x="150" y="487" class="name">config</text>
  <text x="350" y="487" class="cell">immutable</text>
  <text x="535" y="487" class="cell">initialized</text>
  <text x="720" y="487" class="name">Object</text>

  <rect x="125" y="525" width="750" height="66" rx="14" fill="url(#red)" stroke="#d77a6d" stroke-width="2"/>
  <text x="150" y="567" class="danger-name">status</text>
  <text x="350" y="567" class="danger-cell">immutable</text>
  <text x="535" y="567" class="danger-cell">uninitialized</text>
  <text x="720" y="567" class="danger-cell">TDZ · read throws</text>

  <path d="M500 612V675" stroke="#aeb5c1" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="405" y="630" width="190" height="36" rx="18" fill="#303743"/>
  <text x="500" y="655" text-anchor="middle" class="outer-label">[[OuterEnv]]</text>

  <rect x="140" y="688" width="720" height="160" rx="24" fill="url(#purple)" stroke="#8a82ab" stroke-width="3" filter="url(#shadow)"/>
  <text x="185" y="741" class="small-title-purple">Function environment</text>
  <text x="185" y="785" class="small-detail-purple">amount = 0 · precision = 2</text>
  <text x="185" y="820" class="small-detail-purple">Function-specific bindings and this behavior</text>

  <path d="M500 848V911" stroke="#aeb5c1" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="405" y="866" width="190" height="36" rx="18" fill="#303743"/>
  <text x="500" y="891" text-anchor="middle" class="outer-label">[[OuterEnv]]</text>

  <rect x="180" y="924" width="640" height="126" rx="24" fill="url(#blue)" stroke="#5594bb" stroke-width="3" filter="url(#shadow)"/>
  <text x="225" y="976" class="small-title-blue">Global environment</text>
  <text x="225" y="1019" class="small-detail-blue">currency = “USD” · formatPrice</text>

  <path d="M500 1050V1094" stroke="#aeb5c1" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="420" y="1104" width="160" height="43" rx="21" fill="#303743"/>
  <text x="500" y="1133" text-anchor="middle" class="null">null</text>

  <text x="500" y="1170" text-anchor="middle" class="footer">Bindings are specification state · not properties on a hidden JavaScript object</text>
</svg>
