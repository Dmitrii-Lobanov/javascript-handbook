<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" role="img" aria-labelledby="title description">
  <title id="title">Execution context call cycle</title>
  <desc id="description">Three snapshots show a script context running, a calculateTax function call suspending the script while its own context runs, and completion removing the function context so the script resumes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151d"/>
      <stop offset="1" stop-color="#1e2930"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdc6a"/>
      <stop offset="1" stop-color="#f3c542"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece9f8"/>
      <stop offset="1" stop-color="#d9d4ed"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f7f3"/>
      <stop offset="1" stop-color="#b7ebe5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#aeb5c1"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #67d5cc; font-size: 18px; font-weight: 800; letter-spacing: 2.5px; }
      .heading { fill: #f8f5ed; font-size: 36px; font-weight: 800; }
      .stage { fill: #aeb5c1; font-size: 17px; font-weight: 800; letter-spacing: 1.7px; }
      .active-title { fill: #282315; font-size: 29px; font-weight: 800; }
      .active-detail { fill: #514722; font-size: 21px; }
      .callee-title { fill: #29253d; font-size: 29px; font-weight: 800; }
      .callee-detail { fill: #514b6e; font-size: 21px; }
      .paused-title { fill: #d3d7df; font-size: 24px; font-weight: 800; }
      .paused-detail { fill: #9299a7; font-size: 19px; }
      .label { fill: #c3c8d1; font-size: 19px; font-weight: 700; }
      .badge { fill: #173b38; font-size: 15px; font-weight: 900; letter-spacing: 1.3px; }
      .fact-title { fill: #f8f5ed; font-size: 21px; font-weight: 800; }
      .fact-detail { fill: #aeb5c1; font-size: 18px; }
      .footer { fill: #e6e2d9; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1000" height="1180" rx="34" fill="url(#bg)"/>
  <text x="70" y="64" class="eyebrow">CONTROL TRANSFER</text>
  <text x="70" y="112" class="heading">Only one execution context is running</text>

  <text x="100" y="177" class="stage">BEFORE THE CALL</text>
  <rect x="100" y="198" width="800" height="168" rx="25" fill="url(#yellow)" stroke="#aa8527" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="154" cy="252" r="28" fill="#292820"/>
  <text x="154" y="261" text-anchor="middle" fill="#f8f5ed" font-size="22" font-weight="900">1</text>
  <text x="204" y="253" class="active-title">Script context</text>
  <text x="204" y="298" class="active-detail">Running: evaluate calculateTax(100)</text>
  <rect x="700" y="233" width="155" height="40" rx="20" fill="#d9ad2e"/>
  <text x="777" y="259" text-anchor="middle" fill="#30280d" font-size="16" font-weight="900">RUNNING</text>
  <text x="204" y="334" class="active-detail">Continuation: log the returned value</text>

  <path d="M500 366V425" stroke="#aeb5c1" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="370" y="385" width="260" height="36" rx="18" fill="#303743"/>
  <text x="500" y="410" text-anchor="middle" class="label">call → create and push</text>

  <text x="100" y="474" class="stage">DURING THE CALL</text>
  <rect x="100" y="495" width="800" height="330" rx="25" fill="#191d25" stroke="#39414e" stroke-width="2"/>

  <rect x="130" y="528" width="740" height="158" rx="22" fill="url(#purple)" stroke="#8a82ab" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="181" cy="579" r="27" fill="#706990"/>
  <text x="181" y="588" text-anchor="middle" fill="#f8f5ed" font-size="21" font-weight="900">2</text>
  <text x="228" y="579" class="callee-title">calculateTax context</text>
  <text x="228" y="622" class="callee-detail">Running at the top · amount = 100</text>
  <text x="228" y="656" class="callee-detail">Own evaluation state and continuation</text>
  <rect x="705" y="560" width="125" height="40" rx="20" fill="#bdb6d8"/>
  <text x="767" y="586" text-anchor="middle" fill="#332e48" font-size="16" font-weight="900">TOP</text>

  <rect x="170" y="716" width="660" height="78" rx="18" fill="#282d37" stroke="#4b5260" stroke-width="2"/>
  <text x="205" y="751" class="paused-title">Script context</text>
  <text x="205" y="779" class="paused-detail">Suspended below · waiting for the result</text>

  <path d="M500 825V884" stroke="#aeb5c1" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="375" y="844" width="250" height="36" rx="18" fill="#303743"/>
  <text x="500" y="869" text-anchor="middle" class="label">return → pop and resume</text>

  <text x="100" y="933" class="stage">AFTER COMPLETION</text>
  <rect x="100" y="954" width="800" height="154" rx="25" fill="url(#teal)" stroke="#48bfb6" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="154" cy="1005" r="28" fill="#48bfb6"/>
  <text x="154" y="1014" text-anchor="middle" fill="#173b38" font-size="22" font-weight="900">3</text>
  <text x="204" y="1006" fill="#123c39" font-size="29" font-weight="800">Script context resumes</text>
  <text x="204" y="1050" fill="#315e5a" font-size="21">calculateTax context removed · continue after the call</text>
  <rect x="706" y="986" width="149" height="40" rx="20" fill="#8ddbd4"/>
  <text x="780" y="1012" text-anchor="middle" class="badge">RUNNING</text>

  <rect x="100" y="1132" width="800" height="31" rx="15" fill="#2b323c"/>
  <text x="500" y="1154" text-anchor="middle" class="footer">Context = evaluation · scope = name lookup · frame = implementation</text>
</svg>
